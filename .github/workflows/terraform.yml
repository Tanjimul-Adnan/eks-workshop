name: "eks-workshop-terraform"
on:
  push:
    branches:
     - main
     - stage
    paths:
     - 'terraform/**'
  pull_request:
    branches:
     - main
    paths:
     - 'terraform/**' 
  workflow_dispatch:
env:
 AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
 AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 AWS_REGION: us-east-2 
 EKS_CLUSTER: eks-workshop

jobs:
    terraform:
        name: "apply terraform code changes"
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: ./terraform
     
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
               terraform_version: 1.14.8 # <-- Update this line to a newer version

            - name: "Terraform Init"
              id: init
              run: terraform init
            - name: Terraform format 
              id: fmt
              run: terraform fmt -check
            - name: "Terraform validate"
              id: validate
              run: terraform validate
            - name: "Terraform plan"
              id: plan
              run: terraform plan -no-color -input=false -out planfile
              continue-on-error: true
            - name: Terraform plan status
              if: steps.plan.outcome ==  'failure'
              run: exit 1
            - name: Terraform apply
              id: apply
              if: github.ref == 'refs/heads/main' && github.event_name ==  'push'
              run: terraform apply -auto-approve -input=false -parallelism=1  planfile
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}
            - name: Get kube config file
              id: getconfig
              if: steps.apply.outcome ==  'success'
              run: aws eks update-kubeconfig --name $EKS_CLUSTER --region ${{ env.AWS_REGION }}

            - name: Install Ingress controller
              if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
              run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.7.0/deploy/static/provider/aws/deploy.yaml

name: "eks-workshop-terraform"

on:
  push:
    branches:
     - stage
    paths:
     - 'terraform/**'
  pull_request:
    branches:
     - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
     - 'terraform/**' 
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-2

jobs:
    terraform:
        name: "apply terraform code changes"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Set Terraform directory
              id: terraform-dir
              run: |
                set -euo pipefail
                if test -f "${GITHUB_WORKSPACE}/terraform/terraform/main.tf"; then
                  echo "path=${GITHUB_WORKSPACE}/terraform/terraform" >> "${GITHUB_OUTPUT}"
                elif test -f "${GITHUB_WORKSPACE}/terraform/main.tf"; then
                  echo "path=${GITHUB_WORKSPACE}/terraform" >> "${GITHUB_OUTPUT}"
                elif test -f "${GITHUB_WORKSPACE}/main.tf"; then
                  echo "path=${GITHUB_WORKSPACE}" >> "${GITHUB_OUTPUT}"
                else
                  echo "::error::Could not find a Terraform configuration with main.tf"
                  exit 1
                fi
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
               terraform_version: 1.14.8 # <-- Update this line to a newer version

            - name: "Terraform Init"
              id: init
              run: |
                cd "${{ steps.terraform-dir.outputs.path }}"
                terraform init -input=false \
                  -backend-config="bucket=$BUCKET_TF_STATE" \
                  -backend-config="key=gitops/retail-store/terraform.tfstate" \
                  -backend-config="region=$AWS_REGION" \
                  -backend-config="use_lockfile=true"
            - name: Terraform format 
              id: fmt
              if: github.event_name != 'push' || github.ref != 'refs/heads/stage'
              run: |
                cd "${{ steps.terraform-dir.outputs.path }}"
                terraform fmt -check
            - name: "Terraform validate"
              id: validate
              if: github.event_name != 'push' || github.ref != 'refs/heads/stage'
              run: |
                cd "${{ steps.terraform-dir.outputs.path }}"
                terraform validate
            - name: "Terraform plan"
              id: plan
              run: |
                cd "${{ steps.terraform-dir.outputs.path }}"
                terraform plan -no-color -input=false -out planfile
              continue-on-error: true
            - name: Terraform plan status
              if: steps.plan.outcome ==  'failure'
              run: exit 1
            - name: Upload Terraform plan
              uses: actions/upload-artifact@v4
              if: github.event_name == 'pull_request'
              with:
                name: terraform-plan
                path: ${{ steps.terraform-dir.outputs.path }}/planfile

    apply:
        name: "apply terraform changes after pull request merge"
        runs-on: ubuntu-latest
        needs: terraform
        if: >
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.base_ref == 'main'
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Verify Terraform directory
              run: |
                set -euo pipefail
                if test -f "${GITHUB_WORKSPACE}/terraform/terraform/main.tf"; then
                  echo "TF_DIR=${GITHUB_WORKSPACE}/terraform/terraform" >> "${GITHUB_ENV}"
                elif test -f "${GITHUB_WORKSPACE}/terraform/main.tf"; then
                  echo "TF_DIR=${GITHUB_WORKSPACE}/terraform" >> "${GITHUB_ENV}"
                elif test -f "${GITHUB_WORKSPACE}/main.tf"; then
                  echo "TF_DIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
                else
                  echo "::error::Could not find a Terraform configuration with main.tf"
                  exit 1
                fi
                ls -la "${TF_DIR:-${GITHUB_WORKSPACE}}"
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                aws-region: ${{ env.AWS_REGION }}
            - name: Download Terraform plan
              uses: actions/download-artifact@v4
              with:
                name: terraform-plan
                path: ${{ env.TF_DIR }}
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.14.8
            - name: Terraform Init
              run: |
                cd "${TF_DIR}"
                terraform init -input=false \
                  -backend-config="bucket=$BUCKET_TF_STATE" \
                  -backend-config="key=gitops/retail-store/terraform.tfstate" \
                  -backend-config="region=$AWS_REGION" \
                  -backend-config="use_lockfile=true"
            - name: Terraform apply
              run: |
                cd "${TF_DIR}"
                terraform apply -auto-approve -input=false -parallelism=1 planfile
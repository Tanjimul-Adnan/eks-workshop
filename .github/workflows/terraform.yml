name: "eks-workshop-terraform"

on:
  push:
    branches:
     - stage
    paths:
     - 'terraform/**'
  pull_request:
    branches:
     - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
     - 'terraform/**' 
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-2

jobs:
    terraform:
        name: "apply terraform code changes"
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: ./terraform/terraform
     
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
               terraform_version: 1.14.8 # <-- Update this line to a newer version

            - name: "Terraform Init"
              id: init
              run: |
                terraform init -input=false \
                  -backend-config="bucket=$BUCKET_TF_STATE" \
                  -backend-config="key=gitops/retail-store/terraform.tfstate" \
                  -backend-config="region=$AWS_REGION" \
                  -backend-config="use_lockfile=true"
            - name: Terraform format 
              id: fmt
              if: github.event_name != 'push' || github.ref != 'refs/heads/stage'
              run: terraform fmt -check
            - name: "Terraform validate"
              id: validate
              if: github.event_name != 'push' || github.ref != 'refs/heads/stage'
              run: terraform validate
            - name: "Terraform plan"
              id: plan
              run: terraform plan -no-color -input=false -out planfile
              continue-on-error: true
            - name: Terraform plan status
              if: steps.plan.outcome ==  'failure'
              run: exit 1
            - name: Upload Terraform plan
              uses: actions/upload-artifact@v4
              if: github.event_name == 'pull_request'
              with:
                name: terraform-plan
                path: terraform/terraform/planfile

    apply:
        name: "apply terraform changes after pull request merge"
        runs-on: ubuntu-latest
        needs: terraform
        if: >
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.base_ref == 'main'
        defaults:
            run:
                shell: bash
                working-directory: ./terraform/terraform

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                aws-region: ${{ env.AWS_REGION }}
            - name: Download Terraform plan
              uses: actions/download-artifact@v4
              with:
                name: terraform-plan
                path: terraform/terraform
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.14.8
            - name: Terraform Init
              run: |
                terraform init -input=false \
                  -backend-config="bucket=$BUCKET_TF_STATE" \
                  -backend-config="key=gitops/retail-store/terraform.tfstate" \
                  -backend-config="region=$AWS_REGION" \
                  -backend-config="use_lockfile=true"
            - name: Terraform apply
              run: terraform apply -auto-approve -input=false -parallelism=1 planfile